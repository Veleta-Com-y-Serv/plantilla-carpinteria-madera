  servicios:
    activa: true
    antetitulo: Lo que hacemos
    titulo: Piezas a medida, de la cocina a la escalera
    texto: "Todo sale de nuestro taller. Te decimos la madera, el plazo y un precio de partida; el precio cerrado, después de medir."
    cta: { texto: Pide presupuesto, url: "/#presupuesto" }
    items:
      - titulo: Cocinas a medida
        texto: "Muebles de madera maciza que aprovechan cada hueco, con la encimera y los herrajes que elijas."
        madera: "Roble, cerezo o pino lacado"
        plazo: "6 a 8 semanas"
        precio: "desde 6.500 €"
        imagen: /fotos/trabajo-cocina.jpg
        imagenes: "/fotos/contacto.jpg; /fotos/maderas.jpg"
        detalle: |
          Una cocina de madera maciza se hace para durar toda la vida de la casa. Empezamos en tu cocina: medimos paredes, tomas y desagües, y te preguntamos cómo cocináis y qué os estorba hoy. Con eso dibujamos la distribución y te enseñamos muestras de madera y de acabado antes de cortar nada.

          En el taller hacemos los cascos, los frentes y los cajones, con ensambles de verdad y herrajes de cierre suave. Puedes elegir frentes lisos o de cuarterones, al aceite o lacados, y la encimera que mejor te encaje: piedra, madera o compacto.

          El montaje lo hacemos nosotros, con fontanero y electricista de confianza si hace falta. Protegemos la casa, nos llevamos los restos y al final repasamos contigo puertas y cajones hasta que todo cierre como debe.
      - titulo: Armarios empotrados y vestidores
        texto: "Del suelo al techo, por dentro como tú lo uses: baldas, cajones, barras y zapateros."
        madera: "Roble, pino o tablero rechapado"
        plazo: "4 a 5 semanas"
        precio: "desde 1.200 €"
        imagen: /fotos/trabajo-armario.jpg
        imagenes: ""
        detalle: |
          Un armario empotrado bien hecho gana sitio donde parece que no lo hay: bajo una escalera, en una buhardilla o en ese rincón del pasillo. Medimos el hueco con cuidado, porque en las casas de pueblo ninguna pared está a escuadra, y lo ajustamos en obra para que no queden rendijas.

          Por dentro lo organizamos contigo: cuántas barras, qué altura para los abrigos, cajones con guías de extracción total, zapatero o baldas para mantas. Por fuera, puertas abatibles o correderas, lisas o con molduras, al aceite, barnizadas o lacadas en el color de la pared.

          Lo fabricamos en el taller y lo montamos en uno o dos días, según el tamaño. Dejamos la habitación limpia y te explicamos cómo regular las puertas si con el tiempo hiciera falta.
      - titulo: Puertas y ventanas de madera
        texto: "De entrada, de paso y ventanas con contraventana, también copiadas de las antiguas de la casa."
        madera: "Castaño, roble o pino melis"
        plazo: "5 a 7 semanas"
        precio: "Consultar"
        imagen: /fotos/trabajo-ventanas.jpg
        imagenes: ""
        detalle: |
          En las casas de piedra del Bajo Aragón la carpintería de fuera es parte de la fachada. Hacemos puertas de entrada macizas, con clavos de forja o lisas, y ventanas de madera con su contraventana, nuevas o copiadas de las que ya tenía la casa, para que encajen con el resto del pueblo.

          Usamos madera bien seca y con el doble acristalamiento y los herrajes de ahora, así que cierran bien, aíslan y no dejan pasar el aire. Te aconsejamos el acabado según la orientación: lasur que deja ver la veta o pintura en el color tradicional.

          Si tu casa está en un casco histórico, te ayudamos con lo que pide el ayuntamiento antes de empezar. Desmontamos lo viejo, colocamos lo nuevo y rematamos los huecos para que no se note la obra.
      - titulo: Escaleras de madera
        texto: "Rectas o con vuelta, macizas o forrando una de obra, con barandilla torneada o lisa."
        madera: "Pino melis, roble o haya"
        plazo: "6 semanas"
        precio: "Consultar"
        imagen: /fotos/trabajo-escalera.jpg
        imagenes: ""
        detalle: |
          Una escalera se pisa cada día y tiene que sonar firme. Venimos a medir el hueco, la altura entre plantas y el espacio que hay para el arranque, y te proponemos el trazado más cómodo: recta, con meseta o con peldaños de vuelta.

          Podemos hacerla entera de madera maciza o forrar una escalera de obra con huella y contrahuella. La barandilla, con balaustres torneados como las de antes o lisa y sencilla. Las piezas se cortan y se ensamblan en el taller, y se montan en casa en pocos días.

          Al terminar damos el acabado, aceite o barniz al agua, pensando en el paso: que no resbale y que aguante los años.
      - titulo: Muebles a medida
        texto: "Mesas, aparadores, librerías y bancos pensados para tu casa y para durar."
        madera: "Nogal, roble o cerezo"
        plazo: "3 a 6 semanas"
        precio: ""
        imagen: /fotos/trabajo-mesa.jpg
        imagenes: ""
        detalle: ""
      - titulo: Restauración de muebles
        texto: "Recuperamos cómodas, arcones y sillas de la familia: encolado, piezas nuevas y acabado a la cera."
        madera: "La del mueble"
        plazo: "Según el mueble"
        precio: "Consultar"
        imagen: /fotos/trabajo-restauracion.jpg
        imagenes: ""
        detalle: ""

