  opiniones:
    activa: true
    antetitulo: Opiniones
    titulo: Lo que dicen al ver su pieza montada
    testimonios:
      - { texto: "La cocina es exactamente la que dibujaron. Encajaron los muebles en una pared que no tenía nada recto y no se nota.", autor: Pilar y Ramón, nota: "Cocina de roble, Calanda" }
      - { texto: "Copiaron las ventanas viejas de la casa con doble cristal. Por fuera parecen las de siempre y ya no entra el frío.", autor: Andrés M., nota: "Ventanas de castaño, Valderrobres" }
      - { texto: "Restauraron la cómoda de mi abuela y le hicieron un cajón nuevo. Está mejor que cuando la recuerdo.", autor: Teresa G., nota: "Restauración, Alcorisa" }

  taller:
    activa: true
    antetitulo: El taller
    titulo: El mismo banco desde 1979
    desde: "1979"
    texto: |
      El taller lo abrió nuestro padre en Alcañiz haciendo puertas y ventanas para las casas de la comarca. Hoy seguimos los dos hermanos, con dos oficiales que aprendieron aquí.

      Trabajamos con maquinaria de ahora, pero los ensambles y los acabados se siguen haciendo a mano, como nos enseñaron.
    imagen: /fotos/taller.jpg
    items:
      - { titulo: Madera seca de verdad, texto: "Secamos los tablones en el taller antes de usarlos, para que la pieza no se mueva." }
      - { titulo: Ensambles a mano, texto: "Cola de milano, caja y espiga: uniones que aguantan sin depender del tornillo." }
      - { titulo: Acabados que respiran, texto: "Aceite, cera o barniz al agua, según el uso que vaya a tener." }

  zonas:
    activa: true
    titulo_pagina: "Carpintería a medida en {zona}"
    texto_pagina: "En {negocio} medimos, hacemos en el taller y montamos en tu casa: cocinas, armarios, puertas, ventanas y escaleras de madera maciza."
    antetitulo: Dónde montamos
    titulo: Alcañiz y todo el Bajo Aragón
    texto: "Vamos a medir y a montar a menos de una hora del taller. Si tu pueblo no está en la lista, pregúntanos."
    items:
      - titulo: Alcañiz
        texto: "Aquí está el taller y aquí hacemos la mayoría de los encargos: cocinas y armarios para pisos del ensanche, puertas y ventanas para las casas del casco antiguo y escaleras para viviendas que se rehabilitan. Venir a medir no nos cuesta nada, porque estamos a pocos minutos, y si quieres puedes pasar por el taller a ver la madera y los acabados antes de decidir. También trabajamos en los barrios y masías del término municipal."
      - titulo: Caspe
        texto: "En Caspe hacemos muebles a medida, armarios empotrados y carpintería de fuera para casas cerca del pantano, donde la madera tiene que aguantar sol y humedad. Para esas piezas recomendamos pino melis o castaño con un acabado pensado para la intemperie. Vamos a medir y te dejamos el presupuesto por escrito, y el día del montaje venimos con todo preparado para terminar cuanto antes."
      - titulo: Calanda
        texto: "En Calanda hemos hecho cocinas de roble para casas de pueblo, armarios y puertas de paso que siguen el estilo de la vivienda. Muchas casas tienen paredes gruesas y nada a escuadra, así que medimos con calma y ajustamos cada pieza en obra para que quede como si siempre hubiera estado ahí. Trabajamos también en Foz-Calanda y Castelserás."
      - titulo: Valderrobres
        texto: "En Valderrobres y el Matarraña nos llaman sobre todo para rehabilitaciones de casas de piedra: escaleras macizas, vigas vistas, puertas de entrada y ventanas con contraventana que respetan la fachada. Si la casa está en el casco histórico, te contamos qué suele pedir el ayuntamiento antes de empezar. Subimos a medir sin coste y te enseñamos muestras de madera allí mismo."
      - { titulo: Andorra }
      - { titulo: Híjar }
      - { titulo: Alcorisa }
      - { titulo: Castelserás }

  preguntas:
    activa: true
    antetitulo: Preguntas frecuentes
    titulo: Lo que nos preguntáis antes de encargar
    preguntas:
      - { pregunta: "¿Cuánto cuesta un mueble a medida?", respuesta: "Depende de la madera, del tamaño y de los herrajes. En cada servicio te damos un precio de partida; después de medir te dejamos el precio cerrado por escrito y no cambia." }
      - { pregunta: "¿Cuánto se tarda desde que lo encargo?", respuesta: "Entre cuatro y ocho semanas según la pieza. Te damos la fecha de montaje con el presupuesto y te avisamos unos días antes." }
      - { pregunta: "¿Venís a medir a casa?", respuesta: "Sí, y no cobramos la visita en Alcañiz y el Bajo Aragón. Si vives más lejos, te decimos antes lo que cuesta el desplazamiento." }
      - { pregunta: "¿Trabajáis solo madera maciza?", respuesta: "Casi siempre. Para el interior de armarios y algunas cocinas usamos tablero rechapado de calidad, y te lo decimos en el presupuesto." }
      - { pregunta: "¿Hacéis tarimas, vigas o cubiertas?", respuesta: "Sí: tarima maciza, vigas vistas y aleros de madera en rehabilitaciones. Cuéntanos la obra y vamos a verla." }
      - { pregunta: "¿Restauráis muebles antiguos?", respuesta: "Sí. Encolamos, rehacemos piezas que faltan y damos un acabado a la cera o al aceite que respeta el mueble. Tráelo al taller o te lo recogemos." }

